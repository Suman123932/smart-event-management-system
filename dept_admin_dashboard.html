<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dept Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* BACKGROUND */
body{
display:flex;
height:100vh;
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
}

/* SIDEBAR */
.sidebar{
width:240px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.sidebar h2{
text-align:center;
}

/* BUTTON */
.sidebar button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:rgba(255,255,255,0.1);
color:white;
transition:0.3s;
}

.sidebar button:hover{
background:#00c9a7;
}

/* CONTENT */
.content{
flex:1;
padding:20px;
overflow:auto;
}

/* HEADER */
.header{
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:15px;
margin-bottom:20px;
font-size:22px;
font-weight:bold;
text-align:center;
}

/* SECTION */
.section{display:none;}
.active{display:block;}

.card{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
}

/* PROFILE */
.profile-card{
text-align:center;
}

/* CIRCULAR IMAGE */
.profile-img{
width:130px;
height:130px;
border-radius:50%;
border:3px solid #00c9a7;
object-fit:cover;
cursor:pointer;
}

/* HIDDEN INPUT */
#imgInput{
display:none;
}

.info{
margin-top:15px;
}

.info p{
margin:5px 0;
}

.gallery img{
width:120px;
margin:10px;
border-radius:10px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>Dept Admin</h2>

<button onclick="showSection('profile')">👤 Profile</button>
<button onclick="showSection('poster')">🖼 Posters</button>
<button onclick="showSection('analysis')">📊 Analysis</button>
<button onclick="logout()">🚪 Logout</button>

</div>

<!-- CONTENT -->
<div class="content">

<div class="header" id="headerTitle"></div>

<!-- PROFILE -->
<div id="profile" class="section active">
<div class="card profile-card">

<h3>My Profile</h3>

<img id="profileImg" class="profile-img" src="" onclick="triggerUpload()">

<input type="file" id="imgInput" onchange="uploadImage(event)">

<div class="info">
<p id="name"></p>
<p id="email"></p>
<p id="dept"></p>
</div>

</div>
</div>

<!-- POSTER -->
<div id="poster" class="section">
<div class="card">
<h3>Upload Posters</h3>

<input type="file" onchange="uploadPoster(event)">
<div id="posterGallery" class="gallery"></div>

</div>
</div>

<!-- ANALYSIS -->
<div id="analysis" class="section">
<div class="card">
<h3>Analytics</h3>
<canvas id="chart"></canvas>
</div>
</div>

</div>

<script>

/* FETCH REGISTERED USER */
let user = JSON.parse(localStorage.getItem("user")) || {}
let posters = JSON.parse(localStorage.getItem("posters")) || []

/* SET HEADER */
document.getElementById("headerTitle").innerText = user.name + " (Dept Admin)"

/* NAV */
function showSection(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
load()
}

/* LOAD PROFILE */
function loadProfile(){

document.getElementById("name").innerText = "Name: " + (user.name || "")
document.getElementById("email").innerText = "Email: " + (user.email || "")
document.getElementById("dept").innerText = "Department: " + (user.dept || "")

/* IMAGE */
document.getElementById("profileImg").src =
user.img || "https://cdn-icons-png.flaticon.com/512/149/149071.png"
}

/* IMAGE CLICK */
function triggerUpload(){
document.getElementById("imgInput").click()
}

/* UPLOAD IMAGE */
function uploadImage(e){
let reader = new FileReader()

reader.onload = function(){
user.img = reader.result
localStorage.setItem("user", JSON.stringify(user))
loadProfile()
}

reader.readAsDataURL(e.target.files[0])
}

/* POSTERS */
function uploadPoster(e){
let reader=new FileReader()

reader.onload=function(){
posters.push({dept:user.dept,img:reader.result})
localStorage.setItem("posters",JSON.stringify(posters))
load()
}

reader.readAsDataURL(e.target.files[0])
}

/* LOAD */
function load(){

loadProfile()

let imgs=""
posters.forEach(p=>{
if(p.dept===user.dept){
imgs+=`<img src="${p.img}">`
}
})
document.getElementById("posterGallery").innerHTML=imgs
}

/* LOGOUT */
function logout(){
window.location.href="index.html"
}

load()

</script>

</body>
</html>
