<!DOCTYPE html>
<html>
<head>
<title>Smart Event Management</title>

<style>

body{
margin:0;
font-family:Segoe UI;
height:100vh;
color:white;
background-image:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url("https://images.unsplash.com/photo-1505373877841-8d25f7d46678");
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
align-items:center;
}

/* MENU BUTTON */

.menuBtn{
position:fixed;
top:15px;
left:15px;
font-size:28px;
cursor:pointer;
background:#2c3e50;
padding:8px 14px;
border-radius:6px;
z-index:1000;
}

/* SIDE MENU */

.sideMenu{
position:fixed;
top:0;
left:-220px;
width:200px;
height:100%;
background:#1f2d3d;
padding:20px;
transition:0.3s;
z-index:999;
}

.sideMenu h3{
text-align:center;
}

.sideMenu button{
width:100%;
margin-top:15px;
padding:10px;
border:none;
border-radius:6px;
background:#3498db;
color:white;
cursor:pointer;
font-weight:bold;
}

.logoutBtn{
background:#e74c3c;
margin-top:25px;
}

/* CARD */

.card{
margin-top:80px;
width:420px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:35px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* FORM */

.form-group{
width:100%;
margin-top:12px;
}

input,select{
width:100%;
height:42px;
padding:0 10px;
border:none;
border-radius:6px;
box-sizing:border-box;
}

/* BUTTONS */

.button-group{
display:flex;
gap:10px;
margin-top:15px;
}

button{
padding:10px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
flex:1;
}

.createBtn{background:#2ecc71;color:white;}
.cancelBtn{background:#e74c3c;color:white;}
.submitBtn{background:#3498db;color:white;}
.updateBtn{background:#f39c12;color:white;}
.deleteBtn{background:#e74c3c;color:white;}

/* PREVIEW */

.confirmBox{
display:none;
margin-top:15px;
padding:15px;
background:rgba(255,255,255,0.2);
border-radius:8px;
}

/* DASHBOARD */

.dashboard{
display:none;
margin-top:80px;
background:rgba(255,255,255,0.15);
padding:30px;
border-radius:12px;
width:90%;
text-align:center;
}

.stat{
font-size:20px;
margin-top:10px;
}

/* TABLE */

table{
width:100%;
margin-top:30px;
border-collapse:collapse;
background:rgba(255,255,255,0.2);
display:none;
}

th{
background:#2c3e50;
padding:12px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.3);
}

/* UPDATE MODAL */

.updateBox{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.9);
padding:25px;
border-radius:12px;
width:350px;
z-index:1000;
}

.updateBox input,
.updateBox textarea{
width:100%;
margin-top:8px;
padding:8px;
border:none;
border-radius:6px;
}

textarea{
height:70px;
}
.searchBox{
margin-top:20px;
display:flex;
justify-content:center;
gap:8px;
}

.searchBox input{
width:180px;
height:32px;
padding:4px 8px;
border-radius:5px;
border:none;
}

.searchBox button{
height:32px;
padding:0 12px;
font-size:14px;
}
</style>
</head>

<body>

<div class="menuBtn" onclick="toggleMenu()">☰</div>

<div class="sideMenu" id="sideMenu">
<h3>Menu</h3>

<button onclick="showCreate()">Create Event</button>
<button onclick="showDashboard()">Dashboard</button>

<button class="logoutBtn" onclick="logout()">Logout</button>

</div>

<!-- CREATE EVENT -->

<div class="card" id="createPage">

<h2>Create Event</h2>

<div class="form-group">
<select id="type">
<option value="">Select Event Type</option>
<option>Educational</option>
<option>Cultural</option>
<option>Games & Sports</option>
</select>
</div>

<div class="form-group">
<input type="text" id="name" placeholder="Event Name">
</div>

<div class="form-group">
<input type="text" id="dept" placeholder="Department">
</div>

<div class="form-group">
<input type="date" id="date">
</div>

<div class="form-group">
<input type="time" id="time">
</div>

<div class="form-group">
<input type="text" id="venue" placeholder="Venue">
</div>

<div class="form-group">
<input type="number" id="capacity" placeholder="Capacity Needed">
</div>

<div class="button-group">
<button type="button" class="createBtn" onclick="previewEvent()">Create</button>
<button type="button" class="cancelBtn" onclick="clearForm()">Clear</button>
</div>

<div class="confirmBox" id="confirmBox">

<p id="preview"></p>

<div class="button-group">
<button type="button" class="submitBtn" onclick="submitEvent()">Submit</button>
<button type="button" class="cancelBtn" onclick="cancelEvent()">Cancel</button>
</div>

</div>

</div>

<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

<h2>Event Analytics</h2>

<div class="stat">Total Events: <span id="totalEvents">0</span></div>
<div class="stat">Educational: <span id="eduCount">0</span></div>
<div class="stat">Cultural: <span id="culCount">0</span></div>
<div class="stat">Sports: <span id="sportCount">0</span></div>

<br>

<div class="searchBox">
<input type="text" id="searchID" placeholder="Search Event ID">
<button onclick="searchEvent()">Search</button>
</div>


<table id="eventTable"></table>

</div>

<!-- UPDATE BOX -->

<div class="updateBox" id="updateBox">

<h3>Update Event</h3>

<input id="u_type">
<input id="u_name">
<input id="u_dept">
<input id="u_date">
<input id="u_time">
<input id="u_venue">
<input id="u_capacity">

<textarea id="updateReason">NONE</textarea>

<div class="button-group">
<button type="button" class="updateBtn" onclick="confirmUpdate()">Update</button>
<button type="button" class="cancelBtn" onclick="closeUpdate()">Cancel</button>
</div>

</div>

<script>

let events=JSON.parse(localStorage.getItem("events"))||[];
let updateIndex=null;
let eventCounter=1001;

/* MENU */

function toggleMenu(){

let menu=document.getElementById("sideMenu");

if(menu.style.left==="0px"){
menu.style.left="-220px";
}else{
menu.style.left="0px";
}

}

/* LOGOUT */

function logout(){

let confirmLogout = confirm("Are you sure you want to logout?");

if(confirmLogout){
window.location.href="index.html";
}

}

/* CREATE EVENT */

function previewEvent(){

let type=document.getElementById("type").value;
let name=document.getElementById("name").value;
let dept=document.getElementById("dept").value;
let date=document.getElementById("date").value;
let time=document.getElementById("time").value;
let venue=document.getElementById("venue").value;
let capacity=document.getElementById("capacity").value;

if(!type||!name||!dept||!date||!time||!venue||!capacity){
alert("Fill all fields");
return;
}

let id="EVT"+eventCounter;

preview.innerHTML=
`ID: ${id}<br>
Type: ${type}<br>
Name: ${name}<br>
Dept: ${dept}<br>
Date: ${date}<br>
Time: ${time}<br>
Venue: ${venue}<br>
Capacity: ${capacity}`;

confirmBox.style.display="block";

}

function submitEvent(){

let eventObj={
id:"EVT"+eventCounter,
type:document.getElementById("type").value,
name:document.getElementById("name").value,
dept:document.getElementById("dept").value,
date:document.getElementById("date").value,
time:document.getElementById("time").value,
venue:document.getElementById("venue").value,
capacity:document.getElementById("capacity").value
};

events.push(eventObj);

localStorage.setItem("events",JSON.stringify(events));

eventCounter++;

confirmBox.style.display="none";

clearForm();

}

function renderTable(){

let table=document.getElementById("eventTable");

if(events.length===0){
table.style.display="none";
return;
}

table.style.display="table";

table.innerHTML=
`<tr>
<th>ID</th>
<th>Type</th>
<th>Name</th>
<th>Dept</th>
<th>Date</th>
<th>Time</th>
<th>Venue</th>
<th>Capacity</th>
<th>Action</th>
</tr>`;

events.forEach((e,i)=>{

let row=table.insertRow();

row.innerHTML=
`<td>${e.id}</td>
<td>${e.type}</td>
<td>${e.name}</td>
<td>${e.dept}</td>
<td>${e.date}</td>
<td>${e.time}</td>
<td>${e.venue}</td>
<td>${e.capacity}</td>
<td>
<button onclick="editEvent(${i})">Update</button>
<button onclick="deleteEvent(${i})">Delete</button>
</td>`;

});

updateDashboard();

}

function deleteEvent(i){

events.splice(i,1);

localStorage.setItem("events",JSON.stringify(events));

renderTable();

}

function editEvent(i){

updateIndex=i;

let e=events[i];

u_type.value=e.type;
u_name.value=e.name;
u_dept.value=e.dept;
u_date.value=e.date;
u_time.value=e.time;
u_venue.value=e.venue;
u_capacity.value=e.capacity;

updateBox.style.display="block";

}

function confirmUpdate(){

events[updateIndex]={
id:events[updateIndex].id,
type:u_type.value,
name:u_name.value,
dept:u_dept.value,
date:u_date.value,
time:u_time.value,
venue:u_venue.value,
capacity:u_capacity.value
};

localStorage.setItem("events",JSON.stringify(events));

closeUpdate();

renderTable();

}

function closeUpdate(){
updateBox.style.display="none";
}

function searchEvent(){

let id=document.getElementById("searchID").value.trim();

let found=events.find(e=>e.id===id);

if(found){
alert("Event Found: "+found.name+" ("+found.date+")");
}else{
alert("Event Not Found");
}

}

function updateDashboard(){

let edu=0,cul=0,sport=0;

events.forEach(e=>{
if(e.type==="Educational")edu++;
if(e.type==="Cultural")cul++;
if(e.type==="Games & Sports")sport++;
});

totalEvents.innerText=events.length;
eduCount.innerText=edu;
culCount.innerText=cul;
sportCount.innerText=sport;

}

function showDashboard(){

createPage.style.display="none";
dashboard.style.display="block";

renderTable();

}

function showCreate(){

createPage.style.display="block";
dashboard.style.display="none";

}

function clearForm(){

document.getElementById("name").value="";
document.getElementById("dept").value="";
document.getElementById("venue").value="";
document.getElementById("capacity").value="";

}

function cancelEvent(){
confirmBox.style.display="none";
}

</script>

</body>
</html>
