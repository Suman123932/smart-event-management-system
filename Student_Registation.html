<!DOCTYPE html>
<html>
<head>
<title>Event Registrations</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
    url("https://images.unsplash.com/photo-1492684223066-81342ee5ff30");
    background-size: cover;
    background-position: center;
    color:white;
    text-align:center;
}

section{
    display:none;
    padding:40px;
}

.active{
    display:block;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.nav-btn{
    background:orange;
}

.add-btn{
    background:green;
    color:white;
}

input, select{
    width:250px;
    padding:8px;
    margin:8px;
}

form{
    background:rgba(255,255,255,0.1);
    padding:20px;
    border-radius:10px;
    display:inline-block;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th, td{
    border:1px solid white;
    padding:6px;
}
</style>
</head>

<body>

<!-- HOME -->
<section id="home" class="active">
<h1>Event Registrations</h1>
<button class="nav-btn" onclick="showSection('register')">Register</button>
<button class="nav-btn" onclick="showSection('cancel')">Cancel Registration</button>
<button class="nav-btn" onclick="showSection('admin')">Admin Panel</button>
</section>

<!-- REGISTER -->
<section id="register">
<h2>Register Students</h2>

<form id="regForm">
<input type="text" id="name" placeholder="Full Name" required><br>
<input type="text" id="roll" placeholder="Roll Number" required><br>
<input type="text" id="dept" placeholder="Department Name" required><br>
<input type="email" id="email" placeholder="Email" required><br>

<select id="event">
<option>Tech Fest</option>
<option>Cultural Fest</option>
<option>Sports Meet</option>
</select><br>

<select id="position">
<option>Event Manager</option>
<option>Event Coordinator</option>
<option>Event Planner</option>
<option>Registration & Helpdesk Team</option>
</select><br>

<button type="submit">Register</button>
<button type="button" class="add-btn" onclick="resetForm()">Add Another Registration</button>
</form>

<p id="message"></p>
<button onclick="showSection('home')">Back</button>
</section>

<!-- CANCEL -->
<section id="cancel">
<h2>Cancel Registration</h2>
<input type="text" id="cancelID" placeholder="Enter Registration ID">
<button onclick="cancelRegistration()">Cancel</button>
<p id="cancelMsg"></p>
<button onclick="showSection('home')">Back</button>
</section>

<!-- ADMIN -->
<section id="admin">
<h2>All Registrations</h2>
<table id="table">
<tr>
<th>ID</th>
<th>Name</th>
<th>Roll</th>
<th>Dept</th>
<th>Email</th>
<th>Event</th>
<th>Position</th>
</tr>
</table>
<button onclick="loadData()">Refresh</button>
<button onclick="showSection('home')">Back</button>
</section>

<script>

function showSection(id){
    document.querySelectorAll("section").forEach(sec=>sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

document.getElementById("regForm").addEventListener("submit", function(e){
    e.preventDefault();

    let registrations = JSON.parse(localStorage.getItem("registrations")) || [];

    let nameVal = document.getElementById("name").value;
    let rollVal = document.getElementById("roll").value;
    let deptVal = document.getElementById("dept").value;
    let emailVal = document.getElementById("email").value;
    let eventVal = document.getElementById("event").value;
    let positionVal = document.getElementById("position").value;

    if(registrations.some(r => r.email === emailVal)){
        document.getElementById("message").innerHTML = "Email already registered!";
        return;
    }

    let regID = "REG" + Math.floor(Math.random()*10000);

    let data = {
        id: regID,
        name: nameVal,
        roll: rollVal,
        dept: deptVal,
        email: emailVal,
        event: eventVal,
        position: positionVal
    };

    registrations.push(data);
    localStorage.setItem("registrations", JSON.stringify(registrations));

    document.getElementById("message").innerHTML =
    `"Great things never come from comfort zones." <br>
     Registration ID: ${regID}`;

    document.getElementById("regForm").reset();
});

function resetForm(){
    document.getElementById("regForm").reset();
    document.getElementById("message").innerHTML = "Ready for next registration ✅";
}

function cancelRegistration(){
    let regID = document.getElementById("cancelID").value;
    let registrations = JSON.parse(localStorage.getItem("registrations")) || [];

    let updated = registrations.filter(r => r.id !== regID);

    if(updated.length === registrations.length){
        document.getElementById("cancelMsg").innerHTML = "Registration ID not found!";
    }else{
        localStorage.setItem("registrations", JSON.stringify(updated));
        document.getElementById("cancelMsg").innerHTML = "Registration Cancelled Successfully!";
    }
}

function loadData(){
    let registrations = JSON.parse(localStorage.getItem("registrations")) || [];
    let table = document.getElementById("table");

    table.innerHTML = `
    <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Roll</th>
    <th>Dept</th>
    <th>Email</th>
    <th>Event</th>
    <th>Position</th>
    </tr>`;

    registrations.forEach(r=>{
        let row = table.insertRow();
        row.insertCell(0).innerHTML = r.id;
        row.insertCell(1).innerHTML = r.name;
        row.insertCell(2).innerHTML = r.roll;
        row.insertCell(3).innerHTML = r.dept;
        row.insertCell(4).innerHTML = r.email;
        row.insertCell(5).innerHTML = r.event;
        row.insertCell(6).innerHTML = r.position;
    });
}

</script>

</body>
</html>
