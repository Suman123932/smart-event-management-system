<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Super Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
display:flex;
height:100vh;
background:linear-gradient(270deg,#667eea,#764ba2,#6dd5ed,#2193b0);
background-size:800% 800%;
animation:bgMove 18s ease infinite;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* ===== SIDEBAR ===== */
.sidebar{
width:220px;
background:rgba(0,0,0,0.4);
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.sidebar h2{text-align:center;}

.sidebar button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#ff7a18;
color:white;
}

.sidebar button:hover{background:#ff5f00;}

/* ===== MAIN ===== */
.content{
flex:1;
padding:20px;
overflow:auto;
}

.section{display:none;}
.active{display:block;}

.card{
background:rgba(255,255,255,0.15);
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

/* TABLE */
table{width:100%;margin-top:10px;border-collapse:collapse;}
th,td{padding:10px;text-align:center;}
th{background:rgba(0,0,0,0.3);}
td{background:rgba(255,255,255,0.15);}

/* GALLERY */
.gallery img{
width:150px;
margin:10px;
border-radius:10px;
}

/* INPUT */
input,select{
padding:10px;margin:5px;border:none;border-radius:6px;
}

</style>

</head>

<body>

<!-- ===== SIDEBAR ===== -->

<div class="sidebar">
<h2>Admin</h2>
<button onclick="goToAnalysis()">Analysis Dashboard</button>
<button onclick="showSection('events')">Event Management</button>
<button onclick="showSection('gallery')">Gallery Upload</button>
<button onclick="showSection('approval')">Event Approval</button>
<button onclick="logout()">Logout</button>
</div>

<!-- ===== CONTENT ===== -->

<div class="content">

<!-- DASHBOARD -->

<div id="dashboard" class="section active">
<div class="card">
<h3>Analytics</h3>
<canvas id="chart"></canvas>
</div>
</div>

<!-- EVENT MANAGEMENT -->

<div id="events" class="section">
<div class="card">

<h3>Add Event</h3>

<input id="eventName" placeholder="Event Name">
<input id="date" type="date">
<input id="reg" type="number" placeholder="Registrations">

<button onclick="addEvent()">Add</button>

</div>

<div class="card">
<h3>Event List</h3>
<table>
<thead>
<tr><th>Name</th><th>Date</th><th>Reg</th><th>Status</th><th>Action</th></tr>
</thead>
<tbody id="eventTable"></tbody>
</table>
</div>
</div>

<!-- GALLERY -->

<div id="gallery" class="section">
<div class="card">
<h3>Upload Image</h3>
<input type="file" onchange="uploadImage(event)">
<div id="galleryContainer" class="gallery"></div>
</div>
</div>

<!-- APPROVAL -->

<div id="approval" class="section">
<div class="card">
<h3>Approve Events</h3>
<table>
<thead>
<tr><th>Name</th><th>Status</th><th>Action</th></tr>
</thead>
<tbody id="approvalTable"></tbody>
</table>
</div>
</div>

</div>

<script>

let events=JSON.parse(localStorage.getItem("events"))||[]
let gallery=JSON.parse(localStorage.getItem("gallery"))||[]

function showSection(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
load()
}

/* ===== EVENTS ===== */
function addEvent(){
let name=document.getElementById("eventName").value
let date=document.getElementById("date").value
let reg=parseInt(document.getElementById("reg").value)

events.push({name,date,reg,status:"Pending"})
save()
load()
}

function approve(i){
events[i].status="Approved"
save()
load()
}

function deleteEvent(i){
events.splice(i,1)
save()
load()
}

function save(){
localStorage.setItem("events",JSON.stringify(events))
}

/* ===== GALLERY ===== */
function uploadImage(e){
let file=e.target.files[0]
let reader=new FileReader()

reader.onload=function(){
gallery.push(reader.result)
localStorage.setItem("gallery",JSON.stringify(gallery))
load()
}
reader.readAsDataURL(file)
}

/* ===== LOAD ===== */
function load(){

// EVENT TABLE
let table=""
events.forEach((e,i)=>{
table+=`
<tr>
<td>${e.name}</td>
<td>${e.date}</td>
<td>${e.reg}</td>
<td>${e.status}</td>
<td>
<button onclick="approve(${i})">Approve</button>
<button onclick="deleteEvent(${i})">Delete</button>
</td>
</tr>`
})
document.getElementById("eventTable").innerHTML=table

// APPROVAL TABLE
let approval=""
events.forEach((e,i)=>{
if(e.status==="Pending"){
approval+=`
<tr>
<td>${e.name}</td>
<td>${e.status}</td>
<td><button onclick="approve(${i})">Approve</button></td>
</tr>`
}
})
document.getElementById("approvalTable").innerHTML=approval

// GALLERY
let imgs=""
gallery.forEach(img=>{
imgs+=`<img src="${img}">`
})
document.getElementById("galleryContainer").innerHTML=imgs

drawChart()

}

/* ===== CHART ===== */
let chart
function drawChart(){

if(chart) chart.destroy()

let labels=events.map(e=>e.name)
let data=events.map(e=>e.reg)

chart=new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:labels,
datasets:[{
label:"Registrations",
data:data,
backgroundColor:"#4facfe"
}]
}
})
}
function goToAnalysis(){
    window.location.href = "analysis.html";
}

/* ===== LOGOUT ===== */
function logout(){
    alert("Logged out successfully");
    window.location.href = "index.html";
}

load()

</script>

</body>
</html>
