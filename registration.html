<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="register.css">

    <style>

        .popup{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
            justify-content:center;
            align-items:center;
        }

        .popup-content{
            background:#fff;
            padding:25px;
            border-radius:10px;
            text-align:center;
        }

    </style>

</head>

<body>

<div class="auth-container">

<div class="form-box">

<form id="registerForm"
      action="register.php"
      method="POST">

<h2>Create Account</h2>

<p class="subtitle">
Join the Event Management System
</p>

<!-- FULL NAME -->
<div class="input-group">

<label>Full Name</label>

<input type="text"
       name="full_name"
       required>

</div>

<!-- EMAIL -->
<div class="input-group">

<label>Email</label>

<input type="email"
       name="email"
       required>

</div>

<!-- ROLE -->
<div class="input-group">

<label>Role</label>

<select name="role"
        id="role"
        required>

<option value="">Select Role</option>

<option value="super_admin">
Super Admin
</option>

<option value="dept_admin">
Dept Admin
</option>

<option value="event_organizer">
Event Organizer
</option>

</select>

</div>

<!-- DEPARTMENT -->
<div class="input-group"
     id="departmentContainer">

<label>Department</label>

<select name="departmentGroup"
        id="departmentGroup">

<option value="">
Select Department
</option>

<option>Computer Science</option>

<option>Information Technology</option>

<option>Electronics Engineering</option>

<option>Mechanical Engineering</option>

<option>Civil Engineering</option>

<option>Electrical Engineering</option>

<option>Chemical Engineering</option>

</select>

</div>

<!-- PASSWORD -->
<div class="input-group">

<label>Password</label>

<input type="password"
       name="password"
       id="password"
       required>

</div>

<!-- CONFIRM PASSWORD -->
<div class="input-group">

<label>Confirm Password</label>

<input type="password"
       name="confirmPassword"
       id="confirmPassword"
       required>

</div>

<button type="submit"
        class="btn">

Register

</button>

</form>

</div>
</div>

<script>

/* ELEMENTS */

const role =
document.getElementById("role");

const departmentContainer =
document.getElementById("departmentContainer");

const departmentGroup =
document.getElementById("departmentGroup");

/* HIDE DEPARTMENT INITIALLY */

departmentContainer.style.display = "none";

/* SHOW/HIDE DEPARTMENT */

role.addEventListener("change", function(){

    if(this.value === "dept_admin"){

        departmentContainer.style.display = "block";

        departmentGroup.required = true;

    }

    else{

        departmentContainer.style.display = "none";

        departmentGroup.required = false;

        departmentGroup.value = "";
    }

});

/* PASSWORD VALIDATION */

document.getElementById("registerForm")
.addEventListener("submit", function(e){

    let pass =
    document.getElementById("password").value;

    let confirmPass =
    document.getElementById("confirmPassword").value;

    if(pass !== confirmPass){

        e.preventDefault();

        alert("Passwords do not match");

    }

});

</script>

</body>
</html>
