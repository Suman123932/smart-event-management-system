<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#141E30,#243B55);
}

/* Glass Card */
.container{
    width:380px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    box-shadow:0 15px 35px rgba(0,0,0,0.4);
    text-align:center;
    color:#fff;
}

.container h2{
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.2);
    color:#fff;
}

input::placeholder{
    color:#ddd;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#fff;
    color:#141E30;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#00c6ff;
    color:white;
    transform:translateY(-3px);
}

.error{
    color:#ff4d4d;
    font-size:14px;
    margin-top:5px;
}

/* Popup */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    transition:0.3s;
}

.popup.active{
    transform:translate(-50%,-50%) scale(1);
}

.popup h3{
    color:#243B55;
    margin-bottom:15px;
}

.popup button{
    width:auto;
    padding:8px 20px;
    background:#243B55;
    color:white;
}
</style>
</head>

<body>

<div class="container">
    <h2>Verify Your Account</h2>
    <form action="send_otp.php" method="POST">
    <input type="email" id="email" name="email" placeholder="Registered Email">

    <div class="error" id="errorMsg"></div>

    <button onclick="validateUser()">Verify</button>
    </form>
</div>

<!-- Success Popup -->
<div class="popup" id="popup">
    <h3>Account Verified Successfully ✅</h3>
    <button onclick="goToReset()">Proceed to Reset Password</button>
</div>

<script>

// ⚠ DEMO VALID DATA (Replace with database later)
const registeredEmail = "admin@gmail.com";
const registeredId = "12345";

function validateUser(){
    let email = document.getElementById("email").value;
    let id = document.getElementById("userId").value;
    let error = document.getElementById("errorMsg");

    if(email === "" || id === ""){
        error.innerHTML = "Please fill all fields!";
        return;
    }

    if(email === registeredEmail && id === registeredId){
        error.innerHTML = "";
        document.getElementById("popup").classList.add("active");
    } else {
        error.innerHTML = "Invalid Email or ID!";
    }
}

function goToReset(){
    window.location.href = "reset_password.html";
}

</script>

</body>
</html>
