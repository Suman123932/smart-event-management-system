<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Gallery</title>

<style>
/* ===== GLOBAL ===== */
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg,#1e3c72,#2a5298,#6dd5ed,#2193b0);
    background-size:400% 400%;
    animation: bg 10s ease infinite;
    color:white;
    text-align:center;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

h2{
    margin-top:30px;
    font-size:32px;
}

/* ===== GALLERY ===== */
.gallery{
    padding:40px;
}

.gallery-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.gallery-container img{
    width:280px;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    transition:0.4s;
    cursor:pointer;
}

.gallery-container img:hover{
    transform:scale(1.1);
}

/* ===== MODAL ===== */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.modal img{
    width:80%;
    max-width:700px;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}
</style>

</head>

<body>

<h2>Event Gallery</h2>

<section class="gallery">
    <div class="gallery-container">
        <img src="https://source.unsplash.com/300x200/?concert" onclick="openModal(this.src)">
        <img src="https://source.unsplash.com/300x200/?conference" onclick="openModal(this.src)">
        <img src="https://source.unsplash.com/300x200/?festival" onclick="openModal(this.src)">
        <img src="https://source.unsplash.com/300x200/?business" onclick="openModal(this.src)">
        <img src="https://source.unsplash.com/300x200/?technology" onclick="openModal(this.src)">
        <img src="https://source.unsplash.com/300x200/?crowd" onclick="openModal(this.src)">
    </div>
</section>

<!-- MODAL -->

<div class="modal" id="modal" onclick="closeModal()">
    <img id="modalImg">
</div>

<script>
// ===== IMAGE MODAL =====
function openModal(src){
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");

    modal.style.display = "flex";
    modalImg.src = src;
}

// Close when clicking outside image
function closeModal(){
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
