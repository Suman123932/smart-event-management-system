<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e3c72,#2a5298,#00c6ff);
}

/* ================= FORM ================= */

.reset-container{
    width:380px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    text-align:center;
    color:white;
}

.reset-container h2{
    margin-bottom:25px;
}

.input-group{
    position:relative;
    margin:12px 0;
}

.input-group input{
    width:100%;
    padding:12px 40px 12px 12px;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,0.2);
    color:white;
    outline:none;
}

.toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
}

.error{
    color:#ff4d4d;
    font-size:14px;
    margin-top:5px;
}

.reset-container button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:white;
    color:#1e3c72;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.reset-container button:hover{
    background:#00c6ff;
    color:white;
    transform:translateY(-3px);
}

/* ================= ULTRA POPUP ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(8px);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    visibility:hidden;
    transition:0.4s ease;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

.ultra-popup{
    width:380px;
    padding:45px;
    border-radius:25px;
    background:linear-gradient(145deg,#ffffff,#f3f3f3);
    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    transform:scale(0.8);
    transition:0.4s ease;
    animation:float 3s ease-in-out infinite;
}

.overlay.active .ultra-popup{
    transform:scale(1);
}

@keyframes float{
    0%{ transform:translateY(0px);}
    50%{ transform:translateY(-10px);}
    100%{ transform:translateY(0px);}
}

/* Success Ring */

.success-ring{
    margin:auto;
    width:110px;
    height:110px;
    border-radius:50%;
    background:conic-gradient(#4BB543 0% 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 30px #4BB543;
}

.check-svg{
    width:80px;
    height:80px;
}

.check-svg circle{
    fill:none;
    stroke:white;
    stroke-width:6;
    stroke-dasharray:283;
    stroke-dashoffset:283;
    animation:drawCircle 0.6s forwards;
}

.check-svg path{
    fill:none;
    stroke:white;
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:100;
    stroke-dashoffset:100;
    animation:drawTick 0.4s 0.6s forwards;
}

@keyframes drawCircle{
    to{ stroke-dashoffset:0;}
}

@keyframes drawTick{
    to{ stroke-dashoffset:0;}
}

.ultra-popup h2{
    margin-top:25px;
    color:#1e3c72;
}

.ultra-popup p{
    margin:15px 0 25px;
    color:#555;
}

/* Two Buttons */

.button-group{
    display:flex;
    gap:12px;
    justify-content:center;
}

.button-group button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#1e3c72,#00c6ff);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.button-group button:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 25px rgba(0,0,0,0.4);
}

.home-btn{
    background:linear-gradient(45deg,#4BB543,#2ecc71);
}

</style>
</head>

<body>

<div class="reset-container">
    <h2>Set New Password</h2>

    <div class="input-group">
        <form action="reset_password.php" method="POST">
        <input type="password" id="password" name="new_password" placeholder="New Password">
        <span class="toggle" onclick="togglePassword('password')">👁</span>
    </div>

    <div class="input-group">
        <input type="password" id="confirmPassword" name="confirm_Password" placeholder="Confirm Password">
        <span class="toggle" onclick="togglePassword('confirmPassword')">👁</span>
    </div>

    <div class="error" id="errorMsg"></div>

    <button onclick="resetPassword()">Reset Password</button>
</div>

<!-- SUCCESS POPUP -->
<div class="overlay" id="overlay">
    <div class="ultra-popup">
        <div class="success-ring">
            <svg viewBox="0 0 100 100" class="check-svg">
                <circle cx="50" cy="50" r="45"/>
                <path d="M30 52 L45 67 L72 38"/>
            </svg>
        </div>

        <h2>Password Updated Successfully</h2>
        <p>Your password has been changed successfully.</p>

        <div class="button-group">
            <button onclick="goToLogin()">Go to Login</button>
            <button class="home-btn" onclick="goToHome()">Go to Home</button>
        </div>
    </div>
</div>

<script>
function togglePassword(id){
    let input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

function resetPassword(){
    let pass = document.getElementById("password").value;
    let confirmPass = document.getElementById("confirmPassword").value;
    let error = document.getElementById("errorMsg");

    if(pass === "" || confirmPass === ""){
        error.innerHTML = "Please fill all fields!";
        return;
    }

    if(pass !== confirmPass){
        error.innerHTML = "Passwords do not match!";
        return;
    }

    error.innerHTML = "";
    document.getElementById("overlay").classList.add("active");
}

function goToLogin(){
    window.location.href = "login.html";
}

function goToHome(){
    window.location.href = "index.html";
}
</script>
</form>
</body>
</html>
