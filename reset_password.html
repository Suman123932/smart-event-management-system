<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #1e3c72, #2a5298, #00c6ff);
}

/* Glass Card */
.reset-container{
    width:380px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    text-align:center;
    color:#fff;
}

.reset-container h2{
    margin-bottom:25px;
}

/* Input Group */
.input-group{
    position:relative;
    margin:10px 0;
}

.input-group input{
    width:100%;
    padding:12px 40px 12px 12px;
    border-radius:8px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.2);
    color:#fff;
}

/* Eye Icon */
.toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:16px;
    color:#fff;
}

/* Button */
.reset-container button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#fff;
    color:#1e3c72;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.reset-container button:hover{
    background:#00c6ff;
    color:#fff;
    transform:translateY(-3px);
}

/* Error */
.error{
    color:#ff4d4d;
    font-size:14px;
    margin-top:5px;
}

/* Popup */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    transition:0.4s;
}

.popup.active{
    transform:translate(-50%,-50%) scale(1);
}

/* Tick Animation */
.checkmark{
    width:80px;
    height:80px;
    border-radius:50%;
    display:inline-block;
    border:5px solid #4BB543;
    position:relative;
    animation:pop 0.4s ease forwards;
}

.checkmark::after{
    content:'';
    position:absolute;
    left:22px;
    top:40px;
    width:20px;
    height:40px;
    border-right:5px solid #4BB543;
    border-bottom:5px solid #4BB543;
    transform:rotate(45deg);
}

@keyframes pop{
    0%{transform:scale(0);}
    100%{transform:scale(1);}
}

.popup h3{
    margin-top:15px;
    color:#2a5298;
}
</style>
</head>

<body>

<div class="reset-container">
    <h2>Set New Password</h2>

    <div class="input-group">
        <input type="password" id="password" placeholder="New Password">
        <span class="toggle" onclick="togglePassword('password')">👁</span>
    </div>

    <div class="input-group">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <span class="toggle" onclick="togglePassword('confirmPassword')">👁</span>
    </div>

    <div class="error" id="errorMsg"></div>

    <button onclick="resetPassword()">Reset Password</button>
</div>

<!-- Success Popup -->
<div class="popup" id="popup">
    <div class="checkmark"></div>
    <h3>Password Updated Successfully!</h3>
</div>

<script>
function togglePassword(id){
    let input = document.getElementById(id);
    if(input.type === "password"){
        input.type = "text";
    } else {
        input.type = "password";
    }
}

function resetPassword(){
    let pass = document.getElementById("password").value;
    let confirmPass = document.getElementById("confirmPassword").value;
    let error = document.getElementById("errorMsg");

    if(pass === "" || confirmPass === ""){
        error.innerHTML = "Please fill all fields!";
        return;
    }

    if(pass !== confirmPass){
        error.innerHTML = "Passwords do not match!";
        return;
    }

    error.innerHTML = "";
    document.getElementById("popup").classList.add("active");

    // Redirect to login page after 2 seconds
    setTimeout(function(){
        window.location.href = "login.html";
    }, 2000);
}
</script>

</body>
</html>
