<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Organizer Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{
height:100vh;
background:linear-gradient(-45deg,#141e30,#243b55,#0f2027,#2c5364);
background-size:400% 400%;
animation:bg 12s ease infinite;color:white;overflow:hidden;
}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.sidebar{position:fixed;width:230px;height:100%;background:rgba(0,0,0,0.45);padding-top:20px}
.sidebar h2{text-align:center;margin-bottom:30px}
.sidebar a{display:block;padding:15px;color:white;text-decoration:none;cursor:pointer}
.sidebar a:hover{background:#00c6ff}

.main{margin-left:230px;padding:30px}
.page{display:none}.active{display:block}

.card{background:rgba(255,255,255,0.12);padding:20px;border-radius:20px;margin-bottom:20px}
button{padding:6px 12px;border:none;border-radius:8px;background:#00c6ff;color:white;cursor:pointer;margin:5px}
button:hover{background:#0072ff}
ul{margin-top:10px} li{margin-top:8px}
canvas{background:white;border-radius:10px;padding:10px}
</style>
</head>

<body>

<div class="sidebar">
<h2>Organizer</h2>
<a onclick="openPage('home')">Dashboard</a>
<a onclick="openPage('manage')">Manage Events</a>
<a onclick="openPage('poster')">Poster Generator</a>
<a onclick="openPage('reviews')">Event Reviews</a>
<a onclick="openPage('analytics')">Analytics</a>
<a onclick="logout()">Logout</a>
</div>

<div class="main">

<!-- HOME -->
<div id="home" class="page active">
<h1>Welcome Organizer 🎉🎊</h1>
</div>

<!-- MANAGE EVENTS -->
<div id="manage" class="page">
<div class="card">
<h2>Pending Events</h2>
<ul id="pendingList"></ul>
</div>
</div>

<!-- POSTER -->
<div id="poster" class="page">
<div class="card">
<h2>Poster Generator</h2>
<input id="posterTitle" placeholder="Event Title">
<input id="posterDate" placeholder="Date">
<input id="posterVenue" placeholder="Venue">
<button onclick="generatePoster()">Generate</button><br><br>
<canvas id="posterCanvas" width="400" height="500"></canvas>
</div>
</div>

<!-- REVIEWS -->
<div id="reviews" class="page">
<div class="card">
<h2>User Reviews ⭐</h2>
<ul id="reviewList">
<li>Rahul ⭐5 - Amazing Hackathon!</li>
<li>Anita ⭐4 - Loved Music Night</li>
<li>Karan ⭐5 - Great management</li>
</ul>
</div>
</div>

<!-- ANALYTICS -->
<div id="analytics" class="page">
<div class="card">
<h2>Analytics</h2>
<canvas id="chart"></canvas>
</div>
</div>

</div>

<script>
let pendingEvents=[
{name:"Hackathon",date:"2026-05-01",time:"10:00",venue:"Auditorium"},
{name:"Music Night",date:"2026-05-05",time:"18:00",venue:"Open Stage"}
];
let confirmedCount=0;

/* NAV */
function openPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
loadPending(); drawChart();
}
function logout(){window.location.href="index.html";}

/* LOAD EVENTS */
function loadPending(){
let html="";
pendingEvents.forEach((e,i)=>{
html+=`<li>
<b>${e.name}</b> | ${e.date} | ${e.time} | ${e.venue}
<button onclick="confirmEvent(${i})">Confirm</button>
<button onclick="rejectEvent(${i})">Reject</button>
</li>`;
});
pendingList.innerHTML=html;
}

/* CONFIRM / REJECT */
function confirmEvent(i){pendingEvents.splice(i,1);confirmedCount++;loadPending();}
function rejectEvent(i){pendingEvents.splice(i,1);loadPending();}

/* POSTER */
function generatePoster(){
let c=posterCanvas.getContext("2d");
c.fillStyle="#141e30"; c.fillRect(0,0,400,500);
c.fillStyle="white"; c.font="28px Arial";
c.fillText(posterTitle.value,30,150);
c.font="18px Arial";
c.fillText("Date: "+posterDate.value,30,250);
c.fillText("Venue: "+posterVenue.value,30,300);
}

/* CHART */
function drawChart(){
new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["Confirmed Events"],
datasets:[{data:[confirmedCount],backgroundColor:"#00c6ff"}]
}
});
}

loadPending();
</script>

</body>
</html>
