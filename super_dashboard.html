<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Event Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
height:100vh;
background:linear-gradient(270deg,#667eea,#764ba2,#6dd5ed,#2193b0);
background-size:800% 800%;
animation:bgMove 18s ease infinite;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.header{
text-align:center;
padding:20px;
font-size:26px;
font-weight:bold;
background:rgba(0,0,0,0.25);
backdrop-filter:blur(8px);
}

.main{
display:flex;
gap:20px;
padding:20px;
height:calc(100vh - 80px);
}

.left{
width:70%;
display:flex;
flex-direction:column;
gap:20px;
overflow:auto;
}

.right{
width:30%;
display:flex;
flex-direction:column;
gap:20px;
}

.card{
background:rgba(255,255,255,0.15);
border-radius:12px;
padding:20px;
backdrop-filter:blur(12px);
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

input,select{
padding:10px;
margin:5px;
border:none;
border-radius:6px;
}

button{
padding:10px 14px;
margin:5px;
border:none;
border-radius:6px;
background:#ff7a18;
color:white;
cursor:pointer;
}

button:hover{
background:#ff5f00;
}

.stats{
display:flex;
gap:15px;
}

.statbox{
flex:1;
padding:20px;
border-radius:10px;
text-align:center;
background:rgba(0,0,0,0.25);
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:10px;
text-align:center;
}

th{
background:rgba(0,0,0,0.3);
}

td{
background:rgba(255,255,255,0.15);
}

canvas{
background:white;
border-radius:10px;
padding:10px;
}

.searchbar{
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="header">
Super Admin Event Management Dashboard
</div>

<div class="main">

<div class="left">

<div class="card">

<h3>Add Event</h3>

<input id="eventName" placeholder="Event Name">

<select id="dept">
<option value="">Department</option>
<option>Computer Science</option>
<option>Mechanical</option>
<option>Electrical</option>
<option>Civil</option>
<option>Management</option>
</select>

<input type="date" id="date">

<input type="number" id="reg" placeholder="Registrations">

<button onclick="addEvent()">Add Event</button>

</div>

<div class="stats">

<div class="statbox">
<h2 id="totalEvents">0</h2>
<p>Total Events</p>
</div>

<div class="statbox">
<h2 id="totalReg">0</h2>
<p>Total Registrations</p>
</div>

<div class="statbox">
<h2 id="avgAtt">0%</h2>
<p>Average Attendance</p>
</div>

</div>

<div class="card">

<h3>Events Data</h3>

<div class="searchbar">

<input id="searchEvent" placeholder="Search Event..." onkeyup="searchEvent()">

<input type="date" id="calendarFilter" onchange="filterDate()">

</div>

<table>

<thead>
<tr>
<th>Event</th>
<th>Dept</th>
<th>Date</th>
<th>Registrations</th>
<th>Attendance</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="eventTable"></tbody>

</table>

</div>

</div>

<div class="right">

<div class="card">
<h3 style="text-align:center">Event Analytics</h3>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h3 style="text-align:center">Department Analytics</h3>
<canvas id="deptChart"></canvas>
</div>

</div>

</div>

<script>

let events = JSON.parse(localStorage.getItem("events")) || []
let filteredEvents=[...events]

function getStatus(date){
let today=new Date().toISOString().split("T")[0]
return date < today ? "Completed":"Upcoming"
}

function addEvent(){

let name=document.getElementById("eventName").value
let dept=document.getElementById("dept").value
let date=document.getElementById("date").value
let reg=parseInt(document.getElementById("reg").value)

if(name==""||dept==""||date==""||isNaN(reg)){
alert("Fill all fields")
return
}

events.push({name,dept,date,reg,att:0})

save()
filteredEvents=[...events]
load()

}

function updateEvent(i){

let e=filteredEvents[i]

let name=prompt("update Event Name",e.name)
let dept=prompt("update Department",e.dept)
let date=prompt("update Date (YYYY-MM-DD)",e.date)
let reg=prompt("update Registrations",e.reg)
let att=prompt("update Attendance",e.att)

if(name!=null){
e.name=name
e.dept=dept
e.date=date
e.reg=parseInt(reg)
e.att=parseInt(att)
}

save()
load()

}

function deleteEvent(i){

if(confirm("Delete Event?")){
events.splice(i,1)
save()
filteredEvents=[...events]
load()
}

}

function save(){
localStorage.setItem("events",JSON.stringify(events))
}

function searchEvent(){

let text=document.getElementById("searchEvent").value.toLowerCase()
filteredEvents=events.filter(e=>e.name.toLowerCase().includes(text))
load()

}

function filterDate(){

let date=document.getElementById("calendarFilter").value
filteredEvents=events.filter(e=>e.date==date)
load()

}

function load(){

let table=""
let labels=[]
let regData=[]
let attData=[]
let deptData={}

let totalReg=0
let totalAtt=0

filteredEvents.forEach((e,i)=>{

let status=getStatus(e.date)

table+=`
<tr>
<td>${e.name}</td>
<td>${e.dept}</td>
<td>${e.date}</td>
<td>${e.reg}</td>
<td>${e.att}</td>
<td>${status}</td>
<td>
<button onclick="updateEvent(${i})">Update</button>
<button onclick="deleteEvent(${i})">Delete</button>
</td>
</tr>
`

labels.push(e.name)
regData.push(e.reg)
attData.push(e.att)

totalReg+=e.reg
totalAtt+=e.att

if(!deptData[e.dept]) deptData[e.dept]=0
deptData[e.dept]++

})

document.getElementById("eventTable").innerHTML=table

document.getElementById("totalEvents").innerText=events.length
document.getElementById("totalReg").innerText=totalReg

let avg=totalReg==0?0:((totalAtt/totalReg)*100).toFixed(1)
document.getElementById("avgAtt").innerText=avg+"%"

drawChart(labels,regData,attData)

drawDeptChart(Object.keys(deptData),Object.values(deptData))

}

let chart
let deptChart

function drawChart(labels,regData,attData){

if(chart) chart.destroy()

chart=new Chart(document.getElementById("chart"),{

type:"bar",

data:{
labels:labels,
datasets:[
{
label:"Registrations",
data:regData,
backgroundColor:"#4facfe"
},
{
label:"Attendance",
data:attData,
backgroundColor:"#00f2fe"
}
]
}

})

}

function drawDeptChart(labels,data){

if(deptChart) deptChart.destroy()

deptChart=new Chart(document.getElementById("deptChart"),{

type:"pie",

data:{
labels:labels,
datasets:[
{
data:data,
backgroundColor:[
"#ff9a9e",
"#fad0c4",
"#fbc2eb",
"#a1c4fd",
"#84fab0"
]
}
]
}

})

}

load()

</script>

</body>
</html>
